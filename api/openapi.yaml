  /api/cloud/buckets/:
    get:
      description: |-
        Adds :class:`~account.iam_enforcement.IAMActionPermission` as an
        intersection with the route's existing permission classes (spec §6).

        Detail routes (``self.detail``) defer the role/scope check to
        ``has_object_permission`` so the account-scoped ``get_object`` answers 404
        for foreign IDs before any role denial; every other route enforces in
        ``has_permission``. A detail action that never calls ``get_object`` would
        skip enforcement — the route probes pin the denial for each route.
      operationId: cloud_buckets_list
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Bucket"
                type: array
          description: ""
      security:
      - tokenAuth: []
      - cookieAuth: []
      tags:
      - cloud
    post:
      description: Create a bucket
      operationId: cloud_buckets_create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketCreate"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bucket"
          description: ""
      security:
      - tokenAuth: []
      - cookieAuth: []
      tags:
      - cloud
  /api/cloud/buckets/{id}/:
    delete:
      description: Cancel a bucket
      operationId: cloud_buckets_destroy
      parameters:
      - description: A unique integer value identifying this S3 bucket.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
        style: simple
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BucketCancelResponse"
          description: ""
      security:
      - tokenAuth: []
      - cookieAuth: []
      tags:
      - cloud
    get:
      description: |-
        Adds :class:`~account.iam_enforcement.IAMActionPermission` as an
        intersection with the route's existing permission classes (spec §6).

        Detail routes (``self.detail``) defer the role/scope check to
        ``has_object_permission`` so the account-scoped ``get_object`` answers 404
        for foreign IDs before any role denial; every other route enforces in
        ``has_permission``. A detail action that never calls ``get_object`` would
        skip enforcement — the route probes pin the denial for each route.
      operationId: cloud_buckets_retrieve
      parameters:
      - description: A unique integer value identifying this S3 bucket.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: integer
