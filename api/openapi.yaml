        required: false
        schema:
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAPITokenListList"
          description: ""
      security:
      - tokenAuth: []
      - cookieAuth: []
      tags:
      - account
    post:
