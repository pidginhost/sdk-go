          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachIPv4Response"
          description: ""
      security:
      - tokenAuth: []
      - cookieAuth: []
      tags:
      - cloud
  /api/cloud/servers/{id}/attach-ipv6/:
    post:
