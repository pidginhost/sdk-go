  /api/cloud/servers/{id}/attach-ipv4/:
    post:
      description: "Attach IPv4 address to server. The first attach lands on the primary\
        \ NIC; subsequent attaches add a new secondary NIC carrying just that IPv4.\
        \ The address is written to the machine's network configuration, which the\
        \ guest OS only reads while booting: a running server answers `reboot_required:\
        \ true` and stays unreachable on that address until it is restarted. Send\
        \ `reboot: true` to have the restart issued here."
      operationId: cloud_servers_attach_ipv4_create
      parameters:
      - description: A unique integer value identifying this virtual machine.
        explode: false
        in: path
        name: id
        required: true
