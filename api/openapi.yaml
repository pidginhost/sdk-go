components:
  schemas:
    APITokenCreate:
      description: |-
        Label bound tokens with their account + membership status (spec §4.2).

        A dark deployment (flag off) with only personal rows keeps the exact
        pre-feature response shape; a bound row is always labeled so it cannot be
        mistaken for a personal token even after an emergency disable.
      example:
        id: 0
        name: name
        scope: read_only
        key: key
        created: created
        account: account
        membership_status: membership_status
      properties:
        id:
          readOnly: true
          type: integer
        name:
          maxLength: 100
          type: string
        scope:
          $ref: "#/components/schemas/ScopeEnum"
        key:
          readOnly: true
          type: string
        created:
          readOnly: true
          type: string
        account:
          format: email
          nullable: true
          readOnly: true
          type: string
        membership_status:
          nullable: true
          readOnly: true
          type: string
      required:
      - account
      - created
      - id
      - key
      - membership_status
      - name
      type: object
    APITokenList:
      description: |-
        Label bound tokens with their account + membership status (spec §4.2).

        A dark deployment (flag off) with only personal rows keeps the exact
        pre-feature response shape; a bound row is always labeled so it cannot be
        mistaken for a personal token even after an emergency disable.
      example:
        id: 0
        name: name
        scope: ""
        key_prefix: key_prefix
        created: created
        last_used: last_used
        request_count: 6
        account: account
        membership_status: membership_status
      properties:
        id:
          readOnly: true
          type: integer
        name:
          readOnly: true
          type: string
        scope:
          allOf:
          - $ref: "#/components/schemas/ScopeEnum"
          readOnly: true
        key_prefix:
          readOnly: true
          type: string
        created:
          readOnly: true
          type: string
        last_used:
          nullable: true
          readOnly: true
          type: string
        request_count:
          readOnly: true
          type: integer
        account:
          format: email
          nullable: true
          readOnly: true
          type: string
        membership_status:
          nullable: true
          readOnly: true
          type: string
      required:
      - account
      - created
      - id
      - key_prefix
      - last_used
      - membership_status
      - name
      - request_count
      - scope
